name: Build and Push Image

# Builds every checkpoint variant on push to main, one runner each. Doc-only
# commits are excluded: these images are ~45 GB and a README typo is not worth
# two rebuilds.
on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - "tests/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # One variant per runner, because each needs the whole ~101 GB of scratch
    # space to itself. Add a row to build another checkpoint alongside these;
    # every tag keeps its own image in GHCR, so A/B is repointing the endpoint.
    # No :latest — with several variants a moving tag is only a way to
    # accidentally repoint a working endpoint.
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            tag: dasiwa-truevision-v10
          - dockerfile: Dockerfile.lightspeed-v11
            tag: dasiwa-lightspeed-v11

    name: ${{ matrix.tag }}

    steps:
      # ~45 GB of layers plus their (incompressible) push blobs is ~90 GB at
      # peak, against a runner with ~45 GB free on / and ~65 GB on /mnt.
      # Deleting preinstalled toolchains alone does not get there: this action
      # LVMs the free space on BOTH disks into one volume and mounts it where
      # Docker keeps everything. Docker needs a restart afterwards, because its
      # data directory was just replaced underneath it.
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 6144
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          build-mount-path: "/var/lib/docker"
          build-mount-path-ownership: "root:root"

      - name: Restart Docker
        run: sudo systemctl restart docker

      - name: Disk space before build
        run: df -h / /var/lib/docker

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Runners are ephemeral, so without a cache every build re-downloads
      # 35 GiB of weights from HuggingFace. cache-from reads the previous
      # :latest, and type=inline stores the cache metadata in the image itself
      # rather than as a second 45 GB artifact in the registry. Layers already
      # in GHCR are skipped on push, so an edit to handler.py (the last layer)
      # uploads almost nothing.
      #
      # No cache-to: type=gha — that cache is capped at 10 GB per repository.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}:${{ matrix.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}:${{ matrix.tag }}
          cache-to: type=inline
          # The checkpoints come from Civitai, which needs a bearer token. Same
          # secret-mount pattern as the krea2 worker; it never lands in a layer.
          secrets: |
            CIVITAI_TOKEN=${{ secrets.CIVITAI_TOKEN }}

      - name: Disk space after build
        if: always()
        run: df -h / /var/lib/docker || true
