name: Build and Push Image

# Builds on every push to main, like the krea2 worker. Doc-only commits are
# excluded: this image is ~45 GB and a README typo is not worth a rebuild.
on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - "tests/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Override the image tag (defaults to IMAGE_TAG below)"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  # Change this per model build, alongside the weights in the Dockerfile.
  # Every build also pushes :latest, so pin each endpoint to its own tag —
  # :wan2.2-i2v still holds the stock Comfy-Org weights, so rolling back is
  # repointing the endpoint rather than rebuilding.
  IMAGE_TAG: dasiwa-truevision-v10

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # ~45 GB of layers plus their (incompressible) push blobs is ~90 GB at
      # peak, against a runner with ~45 GB free on / and ~65 GB on /mnt.
      # Deleting preinstalled toolchains alone does not get there: this action
      # LVMs the free space on BOTH disks into one volume and mounts it where
      # Docker keeps everything. Docker needs a restart afterwards, because its
      # data directory was just replaced underneath it.
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 6144
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          build-mount-path: "/var/lib/docker"
          build-mount-path-ownership: "root:root"

      - name: Restart Docker
        run: sudo systemctl restart docker

      - name: Disk space before build
        run: df -h / /var/lib/docker

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Runners are ephemeral, so without a cache every build re-downloads
      # 35 GiB of weights from HuggingFace. cache-from reads the previous
      # :latest, and type=inline stores the cache metadata in the image itself
      # rather than as a second 45 GB artifact in the registry. Layers already
      # in GHCR are skipped on push, so an edit to handler.py (the last layer)
      # uploads almost nothing.
      #
      # No cache-to: type=gha — that cache is capped at 10 GB per repository.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ inputs.tag || env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ github.repository }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}:latest
          cache-to: type=inline
          # The checkpoints come from Civitai, which needs a bearer token. Same
          # secret-mount pattern as the krea2 worker; it never lands in a layer.
          secrets: |
            CIVITAI_TOKEN=${{ secrets.CIVITAI_TOKEN }}

      - name: Disk space after build
        if: always()
        run: df -h / /var/lib/docker || true
