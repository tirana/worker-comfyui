name: Build Wan 2.2 I2V image

# Manual only. The image is ~45 GB (35 GiB of weights on top of the ~10 GB
# base) and takes 40-70 minutes, most of it uploading — running it on every
# push would be wasteful.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag prefix, e.g. 1.0 -> ghcr.io/<owner>/worker-comfyui:1.0-wan2.2-i2v"
        required: true
        default: "1.0"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # The disk arithmetic: ~45 GB of layers plus their (incompressible)
      # push blobs is ~90 GB at peak, against a runner that has ~45 GB free on
      # / and ~65 GB on /mnt. Deleting preinstalled toolchains alone does not
      # get there — this action LVMs the free space on BOTH disks into one
      # volume and mounts it where Docker keeps everything. Must run before
      # buildx setup, and Docker needs a restart afterwards because its data
      # directory has just been replaced underneath it.
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 6144
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          build-mount-path: "/var/lib/docker"
          build-mount-path-ownership: "root:root"

      - name: Restart Docker
        run: sudo systemctl restart docker

      - name: Disk space before build
        run: df -h / /var/lib/docker

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker-bake.hcl reads these as variable defaults from the environment,
      # so the target's existing tag expression produces the GHCR reference
      # without needing a --set override.
      - name: Build and push
        uses: docker/bake-action@v7
        env:
          DOCKERHUB_REPO: ghcr.io/${{ github.repository_owner }}
          DOCKERHUB_IMG: worker-comfyui
          RELEASE_VERSION: ${{ inputs.version }}
        with:
          targets: wan2.2-i2v
          push: true
          # No cache-to: type=gha — the GitHub Actions cache is capped at 10 GB
          # per repository, so a 45 GB image would thrash it and waste time.

      - name: Disk space after build
        if: always()
        run: df -h / /var/lib/docker || true
